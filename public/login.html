<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JJMMC Medical College · Sign in</title>

  <!-- PWA metadata -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b5240" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JJMMC ERP" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />

  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <form id="loginForm" class="login-card" autocomplete="off">
      <div class="brand">
        <div class="brand-logo">JJ</div>
        <div>
          <h1>JJMMC Medical College</h1>
          <small>MBBS Programme · NMC Recognised · Sign in to your portal</small>
        </div>
      </div>

      <div class="field">
        <label>Programme</label>
        <div class="program-toggle" role="tablist" aria-label="Programme">
          <button type="button" class="program-opt is-active" data-program="UG" role="tab" aria-selected="true">
            <strong>UG</strong><span>Undergraduate · MBBS / BDS</span>
          </button>
          <button type="button" class="program-opt" data-program="PG" role="tab" aria-selected="false">
            <strong>PG</strong><span>Postgraduate · MD / MS / DNB</span>
          </button>
        </div>
        <input type="hidden" id="program" name="program" value="UG" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Enter your email address" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" required autocomplete="current-password" />
      </div>

      <button class="btn" type="submit" id="submitBtn">Sign in</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>

  <!-- Firebase JS SDK (compat v9 — drop-in replacement for v8 API) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script>
    // UG / PG toggle
    const programInput = document.getElementById('program');
    document.querySelectorAll('.program-opt').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.program-opt').forEach((b) => {
          b.classList.remove('is-active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('is-active');
        btn.setAttribute('aria-selected', 'true');
        programInput.value = btn.dataset.program;
      });
    });

    let firebaseAuth = null;

    // Fetch Firebase public config from the server, then initialise the SDK.
    async function initFirebase() {
      const config = await fetch('/api/firebase-config').then((r) => r.json());
      if (!config.apiKey) throw new Error('Firebase is not configured yet. Contact your administrator.');
      firebase.initializeApp(config);
      firebaseAuth = firebase.auth();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg       = document.getElementById('msg');
      const submitBtn = document.getElementById('submitBtn');
      msg.textContent = '';
      msg.className   = 'msg';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      const email   = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const program  = programInput.value;

      try {
        // Initialise Firebase on first submit (lazy, avoids blocking page load).
        if (!firebaseAuth) await initFirebase();

        // Sign in with Firebase Authentication to get an ID token.
        const credential = await firebaseAuth.signInWithEmailAndPassword(email, password);
        const idToken    = await credential.user.getIdToken();

        // Exchange the ID token for a server session.
        const res  = await fetch('/api/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ idToken, program }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        msg.textContent = 'Signed in. Redirecting…';
        msg.classList.add('ok');
        window.location.href = data.redirect;
      } catch (err) {
        // Map Firebase auth errors to friendly messages.
        let message = err.message || 'Login failed';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' ||
            err.code === 'auth/invalid-credential') {
          message = 'Invalid email or password.';
        } else if (err.code === 'auth/too-many-requests') {
          message = 'Too many failed attempts. Try again later.';
        } else if (err.code === 'auth/network-request-failed') {
          message = 'Network error. Check your connection.';
        }
        msg.textContent = message;
        msg.classList.add('err');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
